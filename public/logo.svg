<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="400" height="400" fill="#000000"/>
  
  <!-- Impossible triangle / Penrose triangle style -->
  <g transform="translate(200, 200)">
    
    <!-- Three interlocking bars forming triangle -->
    <path d="M 0,-90 L 78,45 L 65,60 L 0,-60 Z" 
          fill="#ffffff"/>
    
    <path d="M 0,-90 L -78,45 L -65,60 L 0,-60 Z" 
          fill="#ffffff" 
          opacity="0.6"/>
    
    <path d="M -78,45 L -52,85 L 52,85 L 78,45 L 65,60 L -65,60 Z" 
          fill="#ffffff" 
          opacity="0.8"/>
    
  </g>
  
</svg>